; Redirects for the reflected names the code review's CR3 changed (CODE_REVIEW_PLAN.md §17, decisions D-CR3 and D-CR4), so
; assets and Blueprints saved with the old names load. No project asset names any of them; these can go a cycle after CR3.
; The dynamic delegate FOnVoxelEditBlocked -> FOnVCVoxelEditBlocked needs none: a Blueprint binds the controller's
; OnVoxelEditBlocked property, whose name is unchanged.
[CoreRedirects]
; The VC prefix is the plugin's identity (D-CR3): these read as VoxelWorlds' types (VCP-25).
+EnumRedirects=(OldName="/Script/VoxelCharacterPlugin.EVoxelSurfaceType",NewName="/Script/VoxelCharacterPlugin.EVCSurfaceType")
+EnumRedirects=(OldName="/Script/VoxelCharacterPlugin.EVoxelModificationType",NewName="/Script/VoxelCharacterPlugin.EVCVoxelModificationType")
+StructRedirects=(OldName="/Script/VoxelCharacterPlugin.VoxelTerrainContext",NewName="/Script/VoxelCharacterPlugin.VCTerrainContext")
